# PostgreSQL and the API, for a local run or a test environment:
#   cp .env.example .env      (then change the password)
#   docker compose up --build
# The API is then at http://localhost:3000 (its description at /openapi.json). The data lives in the "db-data" volume.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: insurance_suite
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance -d insurance_suite"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://insurance:${POSTGRES_PASSWORD}@db:5432/insurance_suite
      SEED_DEMO: ${SEED_DEMO:-false}
      AUTH_MODE: ${AUTH_MODE:-oidc} # set AUTH_MODE=header in .env for a local try-out with the X-User header
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
    ports:
      - "3000:3000"

volumes:
  db-data:

# The API half of the deployment in docs/DEPLOY.md: the same server.js, with the data in PostgreSQL.
# Netlify serves the pages and proxies /api here, so the browser sees one site and the session cookie stays same-site.
#
# Render: New -> Blueprint -> pick this repository. It creates the database and the service, and wires DATABASE_URL.
# The one thing left is ALLOWED_ORIGINS, filled in once the Netlify site exists.
#
# The free database Render offers is meant for trying things out (it is time-limited); for anything longer, point
# DATABASE_URL at Neon, Supabase or a paid Render database instead.
databases:
  - name: policycenter-db
    databaseName: policycenter
    user: policycenter
    plan: free

services:
  - type: web
    name: policycenter-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The data. PostgreSQL, not the JSON file: a host's disk does not survive a deploy.
      - key: DATABASE_URL
        fromDatabase:
          name: policycenter-db
          property: connectionString
      # The Netlify site, so a write forwarded by its proxy is accepted (src/security.js). Without this, every POST
      # through Netlify is refused with 403 "This request did not come from this site", sign-in included.
      # If the Netlify project is renamed, change this to the new origin and sync the Blueprint.
      - key: ALLOWED_ORIGINS
        value: https://tangerine-daffodil-1ca625.netlify.app
      # Render terminates https in front of the service.
      - key: TRUST_PROXY
        value: "1"
      # A daily backup is written to the ephemeral disk here; on a managed database use pg_dump instead.
      - key: BACKUP_HOURS
        value: "0"
      - key: AGENT_SWEEP_HOURS
        value: "24"

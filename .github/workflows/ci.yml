# Every push and every pull request: the suite, then the gate that has caught the mistakes this repository actually makes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          pass=$(grep -E '^# pass [0-9]+' test-output.txt | tail -1 | awk '{print $3}')
          echo "tests passed: $pass"
          echo "TESTS_PASSED=$pass" >> "$GITHUB_ENV"

      - name: Merge gate
        run: node scripts/policy-gate.js --base "origin/${{ github.base_ref || 'main' }}" --tests "$TESTS_PASSED"

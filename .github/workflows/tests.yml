name: Tests

# Every push to main and every pull request runs the whole suite. The tests use PGlite (PostgreSQL compiled to
# WebAssembly) for the database store, so no server or Docker is needed here either.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
